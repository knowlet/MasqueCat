name: PR3 Final Review Fix

on:
  push:
    branches:
      - feat/masquecat-h2-fallback

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/masquecat-h2-fallback
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Apply review fixes
        run: python3 .github/scripts/pr3_review_fix.py
      - name: Verify focused regressions
        run: |
          gofmt -w masquecat_h2.go masquecat_h2_client.go masquecat_h2_test.go
          go test -count=1 -run '^(TestMasqueHTTP2DynamicTLSConfigPreservesH2|TestMasqueHTTP2ExtendedConnectDatagramRoundTrip|TestMasqueCorePingControlAddress)$' .
          go test -race -count=1 -run '^TestMasqueHTTP2ExtendedConnectDatagramRoundTrip$' .
          go vet ./...
      - name: Commit fixes
        run: |
          rm .github/workflows/pr3-final-review-fix.yml
          rm .github/scripts/pr3_review_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masquecat_h2.go masquecat_h2_client.go masquecat_h2_test.go cmd/masquecat-relay/README.md .github/workflows/pr3-final-review-fix.yml .github/scripts/pr3_review_fix.py
          git diff --cached --check
          git commit -m 'fix: harden HTTP/2 fallback edge cases'
          git push origin HEAD:feat/masquecat-h2-fallback
