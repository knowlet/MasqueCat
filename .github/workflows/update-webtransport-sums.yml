name: refresh-webtransport-sums

on:
  push:
    branches: [fix/webdemo-pages-opt-in]

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/webdemo-pages-opt-in
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: commit module sums
        run: |
          if git diff --quiet -- go.mod go.sum; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum
          git commit -m 'chore: tidy WebTransport dependencies'
          git push origin HEAD:fix/webdemo-pages-opt-in
