name: PR 3 fixup

on:
  push:
    branches:
      - feat/masquecat-h2-fallback

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/masquecat-h2-fallback
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Apply review fixups
        run: python3 .github/scripts/pr3_fixup.py
      - name: Format and refresh module metadata
        run: |
          gofmt -w masquecat.go masquecat_h2.go
          go mod tidy
          go run ./tool/updateflakes
      - name: Commit fixups
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masquecat.go masquecat_h2.go go.mod go.sum flakehashes.json flake.nix cmd/masquecat-relay/README.md docs/masquecat-relay-deployment.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: address HTTP/2 fallback review feedback'
          git push origin HEAD:feat/masquecat-h2-fallback
