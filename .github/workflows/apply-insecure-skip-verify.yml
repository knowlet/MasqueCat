name: Apply InsecureSkipVerify patch

on:
  push:
    branches: [feat/masquecat-masque-transport]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Apply exact source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('masquecat_transport.go')
          s = p.read_text()
          old = '''func newMasquePath(ctx context.Context, rawURL string, requestTarget key.NodePublic, local key.NodePrivate, mode string, logf logger.Logf) (*masquePath, error) {
          '''
          new = '''func newMasquePath(ctx context.Context, rawURL string, requestTarget key.NodePublic, local key.NodePrivate, mode string, logf logger.Logf) (*masquePath, error) {
          \treturn newMasquePathWithTLS(ctx, rawURL, requestTarget, local, mode, false, logf)
          }

          func newMasquePathWithTLS(ctx context.Context, rawURL string, requestTarget key.NodePublic, local key.NodePrivate, mode string, insecureSkipVerify bool, logf logger.Logf) (*masquePath, error) {
          '''
          if s.count(old) != 1:
              raise SystemExit(f'transport signature matches: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''\tu, _ := url.Parse(rawURL)
          \ttr := &masque.Transport{
          \t\tTLSClientConfig: &tls.Config{
          \t\t\tMinVersion: tls.VersionTLS13,
          \t\t\tServerName: u.Hostname(),
          \t\t\tNextProtos: []string{http3.NextProtoH3},
          \t\t},
          \t\tQUICConfig: &quic.Config{EnableDatagrams: true},
          \t}
          '''
          new = '''\ttlsConfig, err := masqueTLSClientConfig(rawURL, insecureSkipVerify)
          \tif err != nil {
          \t\treturn nil, err
          \t}
          \tif insecureSkipVerify {
          \t\tlogf("WARNING: InsecureSkipVerify enabled for MASQUE endpoint %s; TLS certificate and hostname verification are disabled", rawURL)
          \t}
          \ttr := &masque.Transport{
          \t\tTLSClientConfig: tlsConfig,
          \t\tQUICConfig:     &quic.Config{EnableDatagrams: true},
          \t}
          '''
          if s.count(old) != 1:
              raise SystemExit(f'tls transport block matches: {s.count(old)}')
          s = s.replace(old, new, 1)

          marker = '''func masqueProofForChallenge(local key.NodePrivate, challenge, verifierText string, requestTarget key.NodePublic, mode string) (string, error) {
          '''
          helper = '''func masqueTLSClientConfig(rawURL string, insecureSkipVerify bool) (*tls.Config, error) {
          \tu, err := url.Parse(rawURL)
          \tif err != nil {
          \t\treturn nil, fmt.Errorf("parse MASQUE endpoint URL: %w", err)
          \t}
          \tif u.Scheme != "https" || u.Hostname() == "" {
          \t\treturn nil, errors.New("MASQUE endpoint must be an https URL with a hostname")
          \t}
          \treturn &tls.Config{
          \t\tMinVersion:         tls.VersionTLS13,
          \t\tServerName:         u.Hostname(),
          \t\tNextProtos:         []string{http3.NextProtoH3},
          \t\tInsecureSkipVerify: insecureSkipVerify, //nolint:gosec // Explicit development opt-in exposed by MasqueCat.
          \t}, nil
          }

          '''
          if s.count(marker) != 1:
              raise SystemExit(f'proof marker matches: {s.count(marker)}')
          s = s.replace(marker, helper + marker, 1)
          p.write_text(s)

          p = Path('masquecat.go')
          s = p.read_text()
          old = '''\t// RelayURL, when set, is a MasqueCat relay reached over HTTP/3 CONNECT-UDP.
          \tRelayURL string
          '''
          new = '''\t// RelayURL, when set, is a MasqueCat relay reached over HTTP/3 CONNECT-UDP.
          \tRelayURL string

          \t// InsecureSkipVerify disables TLS certificate and hostname verification for
          \t// outbound MASQUE connections. It is intended only for development with
          \t// explicitly trusted self-signed endpoints and is false by default.
          \tInsecureSkipVerify bool
          '''
          if s.count(old) != 1:
              raise SystemExit(f'server field block matches: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'path, err := newMasquePath(ctx, s.RelayURL, local, priv, masqueModeRelay, logf)'
          new = 'path, err := newMasquePathWithTLS(ctx, s.RelayURL, local, priv, masqueModeRelay, s.InsecureSkipVerify, logf)'
          if s.count(old) != 1:
              raise SystemExit(f'server relay call matches: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''\tServer MasqueConnBlob
          \tKey    key.NodePrivate
          \tLogf   logger.Logf
          '''
          new = '''\tServer MasqueConnBlob
          \tKey    key.NodePrivate
          \tLogf   logger.Logf

          \t// InsecureSkipVerify disables TLS certificate and hostname verification for
          \t// direct and relay MASQUE connections. It is false by default and should
          \t// only be used for explicitly trusted development endpoints.
          \tInsecureSkipVerify bool
          '''
          if s.count(old) != 1:
              raise SystemExit(f'client field block matches: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = 'p, err := newMasquePath(dialCtx, rawURL, target, priv, mode, logf)'
          new = 'p, err := newMasquePathWithTLS(dialCtx, rawURL, target, priv, mode, c.InsecureSkipVerify, logf)'
          if s.count(old) != 1:
              raise SystemExit(f'client path call matches: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          gofmt -w masquecat_transport.go masquecat.go
          git diff --check
      - name: Run targeted tests
        run: go test -count=1 . ./cmd/masquecat-relay
      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-insecure-skip-verify.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add masquecat_transport.go masquecat.go .github/workflows/apply-insecure-skip-verify.yml
          git commit -m 'feat: add explicit insecure MASQUE TLS option'
          git push
