name: oneoff-refresh-upstream-generated-files

on:
  workflow_dispatch:
  push:
    branches:
      - feat/masquecat-masque-transport
    paths:
      - .github/workflows/oneoff-rebase-upstream.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/masquecat-masque-transport
          fetch-depth: 0

      - name: Run upstream tidy generator and commit
        shell: bash
        run: |
          set -euxo pipefail
          make tidy
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum flake.nix flakehashes.json
          if git diff --cached --quiet; then
            echo "upstream-generated files already clean"
            exit 0
          fi
          git commit -m "chore: refresh generated dependency hashes after rebase"
          git push origin HEAD:feat/masquecat-masque-transport
