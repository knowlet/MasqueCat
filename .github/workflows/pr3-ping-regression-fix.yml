name: PR 3 ping regression fix

on:
  push:
    branches: [feat/masquecat-h2-fallback]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/masquecat-h2-fallback
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Patch ping control address and regression test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          core = Path("masquecat_core.go")
          text = core.read_text()
          old = '''\tif err := st.AddProtocolAddress(masqueCoreNIC, tcpip.ProtocolAddress{\n\t\tProtocol: ipv6.ProtocolNumber,\n\t\tAddressWithPrefix: tcpip.AddressWithPrefix{\n\t\t\tAddress:   tcpip.AddrFromSlice(addr.AsSlice()),\n\t\t\tPrefixLen: addr.BitLen(),\n\t\t},\n\t}, stack.AddressProperties{}); err != nil {\n\t\tst.Close()\n\t\treturn nil, fmt.Errorf("masquecat: add local gVisor address: %v", err)\n\t}\n\n\tmtun := newMasqueTun(link)\n'''
          new = '''\tif err := st.AddProtocolAddress(masqueCoreNIC, tcpip.ProtocolAddress{\n\t\tProtocol: ipv6.ProtocolNumber,\n\t\tAddressWithPrefix: tcpip.AddressWithPrefix{\n\t\t\tAddress:   tcpip.AddrFromSlice(addr.AsSlice()),\n\t\t\tPrefixLen: addr.BitLen(),\n\t\t},\n\t}, stack.AddressProperties{}); err != nil {\n\t\tst.Close()\n\t\treturn nil, fmt.Errorf("masquecat: add local gVisor address: %v", err)\n\t}\n\tif err := st.AddProtocolAddress(masqueCoreNIC, tcpip.ProtocolAddress{\n\t\tProtocol: ipv6.ProtocolNumber,\n\t\tAddressWithPrefix: tcpip.AddressWithPrefix{\n\t\t\tAddress:   tcpip.AddrFromSlice(masqueCorePingAddr.AsSlice()),\n\t\t\tPrefixLen: masqueCorePingAddr.BitLen(),\n\t\t},\n\t}, stack.AddressProperties{}); err != nil {\n\t\tst.Close()\n\t\treturn nil, fmt.Errorf("masquecat: add ping gVisor address: %v", err)\n\t}\n\n\tmtun := newMasqueTun(link)\n'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one local gVisor address block")
          core.write_text(text.replace(old, new, 1))

          test = Path("masquecat_core_test.go")
          text = test.read_text()
          old_import = '''import (\n\t"bytes"\n\t"testing"\n'''
          new_import = '''import (\n\t"bytes"\n\t"context"\n\t"testing"\n\t"time"\n'''
          if text.count(old_import) != 1:
              raise SystemExit("unexpected masquecat_core_test.go import block")
          text = text.replace(old_import, new_import, 1)
          addition = r'''

type injectingMasqueForwarder struct {
	dst *masqueCore
}

func (f *injectingMasqueForwarder) ForwardPacket(src, _ key.NodePublic, payload []byte) error {
	return f.dst.Inject(src, payload)
}

func TestMasqueCorePingControlAddress(t *testing.T) {
	client, err := newMasqueCore(key.NewNode(), masqueCoreOptions{}, t.Logf)
	if err != nil {
		t.Fatalf("new client core: %v", err)
	}
	t.Cleanup(func() { _ = client.Close() })

	server, err := newMasqueCore(key.NewNode(), masqueCoreOptions{IsServer: true}, t.Logf)
	if err != nil {
		t.Fatalf("new server core: %v", err)
	}
	t.Cleanup(func() { _ = server.Close() })

	if err := client.SetPath(server.pub, &injectingMasqueForwarder{dst: server}); err != nil {
		t.Fatalf("set client path: %v", err)
	}
	if err := server.SetPath(client.pub, &injectingMasqueForwarder{dst: client}); err != nil {
		t.Fatalf("set server path: %v", err)
	}

	ctx, cancel := context.WithTimeout(context.Background(), 5*time.Second)
	defer cancel()
	if _, err := client.Ping(ctx, server.pub); err != nil {
		t.Fatalf("Ping over internal control address: %v", err)
	}
}
'''
          if "func TestMasqueCorePingControlAddress" in text:
              raise SystemExit("ping regression test already exists")
          test.write_text(text.rstrip() + addition + "\n")
          PY
          gofmt -w masquecat_core.go masquecat_core_test.go
      - name: Verify regression fix
        shell: bash
        run: |
          go test -count=1 -run '^TestMasqueCorePingControlAddress$' .
          go test -count=1 -run '^TestMasqueCore' .
          go vet ./...
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/pr3-ping-regression-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masquecat_core.go masquecat_core_test.go .github/workflows/pr3-ping-regression-fix.yml
          git diff --cached --check
          git commit -m 'fix: register MASQUE ping control address'
          git push origin HEAD:feat/masquecat-h2-fallback
