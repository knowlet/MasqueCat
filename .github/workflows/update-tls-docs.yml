name: Update MASQUE TLS docs

on:
  push:
    branches: [feat/masquecat-masque-transport]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update exact documentation sections
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('docs/masquecat.md')
          s = p.read_text()
          old = '''The current client uses the operating system's normal root trust and verifies
          the endpoint hostname from `DirectURL` / `RelayURL`. Consequently:

          - a publicly trusted certificate is the easiest production setup;
          - an internal CA works only if that CA is already trusted by the host OS;
          - an arbitrary self-signed certificate will fail verification unless its CA is
            installed in the host trust store;
          - an IP-literal URL needs a certificate whose SAN matches that IP.

          Custom per-client root CA configuration is not exposed by the first-cut
          `MasqueClient` API yet.
          '''
          new = '''By default, MasqueCat uses the operating system's normal root trust and verifies
          the endpoint hostname from `DirectURL` / `RelayURL`. Consequently:

          - a publicly trusted certificate is the easiest production setup;
          - an internal CA works only if that CA is already trusted by the host OS;
          - an arbitrary self-signed certificate will fail verification unless its CA is
            installed in the host trust store;
          - an IP-literal URL needs a certificate whose SAN matches that IP.

          For deliberate local-development use, `MasqueClient` and the outbound relay
          side of `MasqueServer` expose `InsecureSkipVerify`. The field is `false` by
          default. Setting it to `true` disables both certificate-chain and hostname
          verification for outbound MASQUE TLS connections and logs an explicit warning.

          ```go
          c := tailcat.NewMasqueClient(token)
          c.InsecureSkipVerify = true // development only
          ```

          The same opt-in is available on a server that connects to a self-signed relay:

          ```go
          s.InsecureSkipVerify = true // outbound RelayURL only
          ```

          > [!WARNING]
          > `InsecureSkipVerify` removes TLS server authentication and permits active
          > man-in-the-middle attacks. It is intended only for explicitly trusted test
          > environments. Normal Internet-facing deployments should use a trusted
          > certificate instead.

          Custom per-client root CA configuration is not exposed by the first-cut
          `MasqueClient` API yet.
          '''
          if s.count(old) != 1:
              raise SystemExit(f'masquecat TLS section matches: {s.count(old)}')
          s = s.replace(old, new, 1)
          stale = '- cryptographic proof of possession for relay registration;\n'
          if stale in s:
              s = s.replace(stale, '', 1)
          p.write_text(s)

          p = Path('docs/masquecat-relay-deployment.md')
          s = p.read_text()
          old = '''| `-listen` | `:443` | no | UDP listen address used by HTTP/3 / QUIC |
          | `-cert` | empty | yes | certificate PEM file |
          | `-key` | empty | yes | private-key PEM file |
          '''
          new = '''| `-listen` | `:443` | no | UDP listen address used by HTTP/3 / QUIC |
          | `-cert` | empty | together with `-key` for non-interactive/production use | certificate PEM file |
          | `-key` | empty | together with `-cert` for non-interactive/production use | private-key PEM file |
          '''
          if s.count(old) != 1:
              raise SystemExit(f'relay flags section matches: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''## 4. TLS certificate

          The relay requires a certificate and private key at startup. The binary loads
          them with `tls.LoadX509KeyPair`.

          Recommended deployment layout:
          '''
          new = '''## 4. TLS certificate

          For non-interactive and production deployments, provide both `-cert` and `-key`.
          The binary loads them with `tls.LoadX509KeyPair`. Supplying only one of the two
          fails startup.

          When neither flag is supplied and stdin is an interactive terminal, the relay
          asks whether it should generate an ephemeral self-signed certificate for that
          process invocation. Answering `y` or `yes` creates an Ed25519-backed certificate
          in memory with a 24-hour lifetime and SANs for `localhost`, the local hostname,
          `127.0.0.1`, and `::1`. It is not written to disk and is regenerated on restart.

          In non-interactive environments such as systemd, CI, or normal container
          launches, missing certificate flags remain a hard error; there is no silent
          security downgrade.

          Recommended deployment layout:
          '''
          if s.count(old) != 1:
              raise SystemExit(f'relay TLS intro matches: {s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''An arbitrary self-signed certificate will fail normal hostname verification
          unless the corresponding CA is installed on every peer.

          The current relay does not reload certificates dynamically. Restart it after
          certificate renewal.
          '''
          new = '''An arbitrary self-signed certificate will fail normal hostname verification
          unless the corresponding CA is installed on every peer. For explicit local
          development, `MasqueClient.InsecureSkipVerify` and
          `MasqueServer.InsecureSkipVerify` can disable verification for outbound MASQUE
          connections. This is an opt-in development escape hatch and should not be used
          for normal Internet-facing deployments because it permits man-in-the-middle
          attacks.

          The current relay does not reload certificates dynamically. Restart it after
          certificate renewal. The interactive ephemeral certificate is regenerated on
          every restart.
          '''
          if s.count(old) != 1:
              raise SystemExit(f'relay self-signed paragraph matches: {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
      - name: Remove one-shot workflow
        run: rm .github/workflows/update-tls-docs.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/masquecat.md docs/masquecat-relay-deployment.md .github/workflows/update-tls-docs.yml
          git commit -m 'docs: document insecure and self-signed TLS modes'
          git push
