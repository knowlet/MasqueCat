name: oneoff-tailcat-cli-integration

on:
  workflow_dispatch:
  push:
    branches:
      - feat/masquecat-masque-transport
    paths:
      - .github/workflows/oneoff-rebase-upstream.yml

permissions:
  contents: write

jobs:
  compatibility-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/masquecat-masque-transport
          fetch-depth: 0

      - name: Apply compatibility fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f"{path}: expected exactly one match, got {n}: {old!r}")
              p.write_text(s.replace(old, new, 1))

          replace_once(
              "cmd/tailcat/masquecat_cli.go",
              'return usagef("genkey --client with --key=default is probably a mistake; client modes automatically load client-default")',
              'return usagef("genkey --client with --key=default is probably a mistake; use --key=client-default for the automatic client key")',
          )

          replace_once(
              "cmd/tailcat/e2e_test.go",
              'args := append([]string{"--key=new", "--derpmap-url=" + e.derpMapURL}, extraFlags...)',
              'args := append([]string{"--legacy-derp", "--key=new", "--derpmap-url=" + e.derpMapURL}, extraFlags...)',
          )

          replace_once(
              "tailcat_ssh.go",
              '\t\t\ts.lb.logf("SSH host keys: %v", err)\n',
              '\t\t\tlogf := s.Logf\n\t\t\tif logf == nil && s.lb != nil {\n\t\t\t\tlogf = s.lb.logf\n\t\t\t}\n\t\t\tif logf != nil {\n\t\t\t\tlogf("SSH host keys: %v", err)\n\t\t\t}\n',
          )
          PY

      - name: Format and commit
        run: |
          set -euxo pipefail
          gofmt -w cmd/tailcat/masquecat_cli.go cmd/tailcat/e2e_test.go tailcat_ssh.go
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/tailcat/masquecat_cli.go cmd/tailcat/e2e_test.go tailcat_ssh.go
          git commit -m "fix: preserve legacy CLI tests and Masque SSH logging"
          git push origin HEAD:feat/masquecat-masque-transport
