name: PR3 Ping Regression Fix

on:
  push:
    branches:
      - feat/masquecat-h2-fallback

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/masquecat-h2-fallback
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Apply ping regression fix
        run: python3 .github/scripts/pr3_ping_regression_fix.py
      - name: Verify regression fix
        run: |
          gofmt -w masquecat_core.go masquecat_core_test.go
          go test -count=1 -run '^TestMasqueCorePingControlAddress$' .
          go test -count=1 -run '^TestMasqueCore' .
          go vet ./...
      - name: Commit fix
        run: |
          rm .github/workflows/pr3-ping-regression-fix.yml
          rm .github/scripts/pr3_ping_regression_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add masquecat_core.go masquecat_core_test.go .github/workflows/pr3-ping-regression-fix.yml .github/scripts/pr3_ping_regression_fix.py
          git diff --cached --check
          git commit -m 'fix: register MASQUE ping control address'
          git push origin HEAD:feat/masquecat-h2-fallback
