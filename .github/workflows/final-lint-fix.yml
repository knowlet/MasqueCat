name: Final cleanup lint fix

on:
  push:
    branches: [feat/masquecat-masque-transport]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/masquecat-masque-transport
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: fix the two remaining errcheck findings
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('tailcat.go')
          s = p.read_text()
          old = '''netMon, err := netmon.New(bus, func(format string, args ...any) { logf(format, args...) })
          if err != nil {
                  lb.Close()
                  return fmt.Errorf("netmon.New: %w", err)
          }'''
          new = '''netMon, err := netmon.New(bus, func(format string, args ...any) { logf(format, args...) })
          if err != nil {
                  _ = lb.Close()
                  return fmt.Errorf("netmon.New: %w", err)
          }'''
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 target netmon cleanup blocks, found {count}')
          p.write_text(s.replace(old, new))
          PY
          gofmt -w tailcat.go
          git diff --check
          git diff -- tailcat.go
      - name: commit fix and remove this temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/final-lint-fix.yml
          git add tailcat.go
          git commit -m "fix: handle remaining backend cleanup errors"
          git push origin HEAD:feat/masquecat-masque-transport
