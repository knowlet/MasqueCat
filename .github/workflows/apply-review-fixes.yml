name: Apply review fixes

on:
  push:
    branches: [feat/masquecat-masque-transport]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/masquecat-masque-transport
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: repair temporary runner literals
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-review-fixes.py')
          s = p.read_text()
          fixes = {
              r'f.Fatalf("canonical packet encoding changed:\n got %x\nwant %x", got, groundTruth)': r'f.Fatalf("canonical packet encoding changed:\\n got %x\\nwant %x", got, groundTruth)',
              r'f.Fatalf("canonical token encoding changed:\n got %s\nwant %s", canonical, canonicalToken)': r'f.Fatalf("canonical token encoding changed:\\n got %s\\nwant %s", canonical, canonicalToken)',
          }
          for old, new in fixes.items():
              if s.count(old) != 1:
                  raise SystemExit(f'expected exactly one escape repair match: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: apply fail-closed review fixes
        run: python3 .github/scripts/apply-review-fixes.py
      - name: apply lifecycle and documentation follow-ups
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old!r}')
              p.write_text(s.replace(old, new, 1))

          # A one-shot Ping/Dial context must not own the long-lived CONNECT-UDP
          # session. The client lifecycle child context is cancelled only by Close.
          replace_once(
              'masquecat.go',
              '\t\tpath, directErr = newMasquePath(ctx, ci.DirectURL, ci.ServerPublic, priv, masqueModeDirect, logf)',
              '\t\tpath, directErr = newMasquePath(childCtx, ci.DirectURL, ci.ServerPublic, priv, masqueModeDirect, logf)',
          )
          replace_once(
              'masquecat.go',
              '\t\tpath, err = newMasquePath(ctx, ci.RelayURL, local, priv, masqueModeRelay, logf)',
              '\t\tpath, err = newMasquePath(childCtx, ci.RelayURL, local, priv, masqueModeRelay, logf)',
          )

          # Keep the scoped hosted-default guard useful for runtime/config assets,
          # not just JS/HTML, without returning to a repository-wide text ban.
          replace_once(
              'upstream_defaults_test.go',
              '\t\tcase ".js", ".html":',
              '\t\tcase ".js", ".html", ".json", ".yaml", ".yml", ".toml", ".nix":',
          )

          replace_once(
              'README.md',
              '''The first relay implementation is **not yet production hardened**. In
          particular, transport-level peer registration still needs cryptographic
          proof-of-possession, resource quotas, abuse controls, and production metrics.
          WireGuard still authenticates the inner peer session.''',
              '''The relay registration layer now requires a one-time cryptographic
          proof of possession of the advertised Tailcat node key before a stream can be
          registered. A live registration is never replaced by an unverified duplicate.
          The relay is still **not yet production hardened**: resource quotas, abuse
          controls, production metrics, and operational hardening remain required.''',
          )
          replace_once(
              'README.md',
              '''- relay registration proof-of-possession
          - direct and relay WireGuard/TCP/SSH E2E tests''',
              '''- direct and relay WireGuard/TCP/SSH E2E tests''',
          )

          replace_once(
              'docs/masquecat.md',
              '''> [!WARNING]
          > The current first-cut relay registration checks that the declared source key
          > matches the key in the CONNECT-UDP target/header, but it does **not yet perform
          > a cryptographic proof-of-possession challenge for that node key at the MASQUE
          > registration layer**. WireGuard still authenticates the actual tunnel, but a
          > hardened public relay should add registration PoP to prevent node-key slot
          > hijacking / denial-of-service. Treat `cmd/masquecat-relay` as experimental
          > until that is implemented.''',
              '''> [!NOTE]
          > Direct and relay registrations now use a one-time server-issued challenge.
          > The claimant proves possession of the advertised Tailcat node private key
          > before the CONNECT-UDP stream is registered; the challenge is bound to the
          > source key, target key, and mode, expires quickly, and cannot replace an
          > existing live registration. This prevents unauthenticated node-key slot
          > hijacking, but it does not replace relay resource quotas, abuse controls, or
          > other production hardening.''',
          )
          PY
      - name: repair fuzz seed variable reuse
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('masquecat_fuzz_test.go')
          s = p.read_text()
          old = '\tsrc = key.NewNode().Public()\n\tdst := key.NewNode().Public()'
          new = '\tsrc = key.NewNode().Public()\n\tdst = key.NewNode().Public()'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one fuzz seed reuse match, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: format and validate focused changes
        shell: bash
        run: |
          gofmt -w masquecat_auth.go masquecat_auth_test.go masquecat_h3_server.go masquecat_transport.go masquecat.go masquecat_token.go masquecat_fuzz_test.go masquecat_transport_test.go masquecat_lifecycle_test.go masquecat_token_edge_test.go upstream_defaults_test.go cmd/tailcat-web/tailcat-web.go tailcat.go
          git diff --check
          go test -count=1 ./...
          go vet ./...
          go test -race -count=1 -timeout 900s .
      - name: commit verified code fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GITHUB_TOKEN cannot modify workflow files. Restore the temporary
          # patch script and test workflow; the connector will clean these up
          # and land the CI permission/matrix change in a separate atomic commit.
          git restore --source=HEAD -- .github/scripts/apply-review-fixes.py .github/workflows/test.yml
          git add -A
          git diff --cached --check
          git commit -m "fix: harden MasqueCat review findings"
          git push origin HEAD:feat/masquecat-masque-transport
