name: oneoff-tailcat-cli-verification

on:
  workflow_dispatch:
  push:
    branches:
      - feat/masquecat-masque-transport
    paths:
      - .github/workflows/oneoff-rebase-upstream.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/masquecat-masque-transport
          fetch-depth: 0

      - name: Verify formatting and modules
        shell: bash
        run: |
          set -euxo pipefail
          test -z "$(gofmt -l cmd/tailcat/tailcat.go cmd/tailcat/masquecat_cli.go cmd/tailcat/masquecat_cli_test.go cmd/tailcat/e2e_test.go tailcat_ssh.go)"
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          cmp go.mod /tmp/go.mod.before
          cmp go.sum /tmp/go.sum.before
          git diff --check

      - name: Test repository
        run: go test -count=1 -timeout 600s ./...

      - name: Build runnable binaries
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/masquecat-bin
          go build -o /tmp/masquecat-bin/tailcat ./cmd/tailcat
          go build -o /tmp/masquecat-bin/masquecat-relay ./cmd/masquecat-relay
          test -x /tmp/masquecat-bin/tailcat
          test -x /tmp/masquecat-bin/masquecat-relay

      - name: Smoke Tailcat-compatible CLI
        shell: bash
        run: |
          set -euxo pipefail
          /tmp/masquecat-bin/tailcat --help | grep -q -- '--relay-url'
          /tmp/masquecat-bin/tailcat --help | grep -q -- '--legacy-derp'
          /tmp/masquecat-bin/tailcat --help | grep -q -- 'serve'
          /tmp/masquecat-bin/tailcat --help | grep -q -- 'ssh'
          set +e
          out="$(env -u MASQUECAT_RELAY_URL -u MASQUECAT_DIRECT_URL /tmp/masquecat-bin/tailcat 2>&1)"
          rc=$?
          set -e
          test "$rc" -ne 0
          printf '%s\n' "$out" | grep -q 'MasqueCat server needs an explicit endpoint'
