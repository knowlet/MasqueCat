name: apply-browser-review-fixes

on:
  push:
    branches:
      - fix/webdemo-pages-opt-in

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/webdemo-pages-opt-in
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: apply review fixes
        run: |
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          gofmt -w masquecat_browser_js.go masquecat_webtransport.go web/main_js.go
      - name: refresh generated module metadata
        run: make tidy
      - name: smoke compile
        run: |
          go build ./...
          GOOS=js GOARCH=wasm go build -o /tmp/tailcat-web.wasm ./web
      - name: commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add masquecat_browser_js.go masquecat_webtransport.go web/main_js.go cmd/masquecat-relay/README.md docs/masquecat-relay-deployment.md flake.nix flakehashes.json go.mod go.sum
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(web): address browser transport review'
          git push origin HEAD:fix/webdemo-pages-opt-in
