name: Fix MASQUE dial lifecycle

on:
  push:
    branches: [feat/masquecat-masque-transport]

permissions:
  contents: write

concurrency:
  group: fix-masque-dial-lifecycle
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/masquecat-masque-transport
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: apply lifecycle boundary fix and regression tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text()
              if new in s:
                  return False
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, found {n}: {old!r}')
              p.write_text(s.replace(old, new, 1))
              return True

          replace_once(
              'masquecat.go',
              '''func (c *MasqueClient) ensureStarted(ctx context.Context) error {
          \tc.mu.Lock()
          \tdefer c.mu.Unlock()
          \treturn c.ensureStartedLocked(ctx)
          }

          func (c *MasqueClient) ensureStartedLocked(ctx context.Context) error {''',
              '''func (c *MasqueClient) ensureStarted(ctx context.Context) error {
          \tc.mu.Lock()
          \tdefer c.mu.Unlock()
          \treturn c.ensureStartedLocked(ctx)
          }

          // masqueDialContext makes an in-flight CONNECT-UDP establishment
          // cancelable by the caller without letting that one-shot operation context
          // own the established transport. Calling finish(true) is the detach point:
          // after it succeeds, only lifecycleCtx can cancel the returned context.
          func masqueDialContext(lifecycleCtx, operationCtx context.Context) (context.Context, func(bool) bool) {
          \tdialCtx, cancelDial := context.WithCancel(lifecycleCtx)
          \tstopOperationCancel := context.AfterFunc(operationCtx, cancelDial)
          \treturn dialCtx, func(keep bool) bool {
          \t\toperationActive := stopOperationCancel()
          \t\tif !keep || !operationActive {
          \t\t\tcancelDial()
          \t\t}
          \t\treturn operationActive
          \t}
          }

          func (c *MasqueClient) ensureStartedLocked(ctx context.Context) error {''',
          )

          replace_once(
              'masquecat.go',
              '''\tchildCtx, cancel := context.WithCancel(context.Background())
          \tlocal := priv.Public()
          \tvar directErr error
          \tvar path *masquePath
          \tvar pathType MasquePathType
          \tif ci.DirectURL != "" {
          \t\tpath, directErr = newMasquePath(childCtx, ci.DirectURL, ci.ServerPublic, priv, masqueModeDirect, logf)
          \t\tif directErr == nil {
          \t\t\tpathType = MasquePathDirect
          \t\t}
          \t}
          \tif path == nil && ci.RelayURL != "" {
          \t\tpath, err = newMasquePath(childCtx, ci.RelayURL, local, priv, masqueModeRelay, logf)''',
              '''\tchildCtx, cancel := context.WithCancel(context.Background())
          \tlocal := priv.Public()
          \tdialPath := func(rawURL string, target key.NodePublic, mode string) (*masquePath, error) {
          \t\tif err := ctx.Err(); err != nil {
          \t\t\treturn nil, err
          \t\t}
          \t\tdialCtx, finishDial := masqueDialContext(childCtx, ctx)
          \t\tp, err := newMasquePath(dialCtx, rawURL, target, priv, mode, logf)
          \t\toperationActive := finishDial(err == nil)
          \t\tif !operationActive {
          \t\t\tif p != nil {
          \t\t\t\t_ = p.Close()
          \t\t\t}
          \t\t\tif ctxErr := ctx.Err(); ctxErr != nil {
          \t\t\t\treturn nil, ctxErr
          \t\t\t}
          \t\t\tif err == nil {
          \t\t\t\treturn nil, context.Canceled
          \t\t\t}
          \t\t}
          \t\treturn p, err
          \t}

          \tvar directErr error
          \tvar path *masquePath
          \tvar pathType MasquePathType
          \tif ci.DirectURL != "" {
          \t\tpath, directErr = dialPath(ci.DirectURL, ci.ServerPublic, masqueModeDirect)
          \t\tif directErr == nil {
          \t\t\tpathType = MasquePathDirect
          \t\t}
          \t}
          \tif path == nil && ci.RelayURL != "" {
          \t\tpath, err = dialPath(ci.RelayURL, local, masqueModeRelay)''',
          )

          test_path = Path('masquecat_lifecycle_test.go')
          tests = test_path.read_text()
          marker = '''func TestMasqueClientPublicKeyStable(t *testing.T) {'''
          addition = '''func TestMasqueDialContextDetachesOperationAfterSuccess(t *testing.T) {
          \tlifecycleCtx, cancelLifecycle := context.WithCancel(context.Background())
          \topCtx, cancelOperation := context.WithCancel(context.Background())
          \tdialCtx, finishDial := masqueDialContext(lifecycleCtx, opCtx)
          \tif !finishDial(true) {
          \t\tt.Fatal("finishDial reported an operation cancellation before success")
          \t}

          \tcancelOperation()
          \tif err := dialCtx.Err(); err != nil {
          \t\tt.Fatalf("operation cancellation leaked into established transport: %v", err)
          \t}

          \tcancelLifecycle()
          \tif err := dialCtx.Err(); err == nil {
          \t\tt.Fatal("lifecycle cancellation did not stop established transport context")
          \t}
          }

          func TestMasqueDialContextHonorsOperationCancellationDuringDial(t *testing.T) {
          \tlifecycleCtx, cancelLifecycle := context.WithCancel(context.Background())
          \tdefer cancelLifecycle()
          \topCtx, cancelOperation := context.WithCancel(context.Background())
          \tdialCtx, finishDial := masqueDialContext(lifecycleCtx, opCtx)

          \tcancelOperation()
          \tif finishDial(true) {
          \t\tt.Fatal("finishDial detached an operation that was already canceled")
          \t}
          \tif err := dialCtx.Err(); err == nil {
          \t\tt.Fatal("operation cancellation did not cancel in-flight dial context")
          \t}
          }

          '''
          if addition not in tests:
              if tests.count(marker) != 1:
                  raise SystemExit(f'expected one lifecycle test insertion marker, found {tests.count(marker)}')
              test_path.write_text(tests.replace(marker, addition + marker, 1))
          PY
          gofmt -w masquecat.go masquecat_lifecycle_test.go
          git diff --check
      - name: validate
        shell: bash
        run: |
          go test -count=1 .
          go test -race -count=1 -timeout 900s .
      - name: commit if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'dial lifecycle fix already present'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add masquecat.go masquecat_lifecycle_test.go
          git diff --cached --check
          git commit -m "fix: preserve MASQUE dial cancellation semantics"
          git push origin HEAD:feat/masquecat-masque-transport
