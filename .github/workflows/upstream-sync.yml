name: Upstream sync verify

on:
  push:
    branches:
      - chore/sync-upstream-20260907
    paths:
      - .github/workflows/upstream-sync.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Normalize merged Go modules
        shell: bash
        run: |
          set -euxo pipefail
          go mod tidy
          if ! git diff --quiet -- go.mod go.sum; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "fix(deps): tidy modules after upstream sync"
            git push origin HEAD:chore/sync-upstream-20260907
          fi
      - name: Test merged tree
        run: go test ./...
      - name: Vet merged tree
        run: go vet ./...
      - name: Build browser demo
        run: go run ./cmd/tailcat-webdist -o /tmp/masquecat-webdist
