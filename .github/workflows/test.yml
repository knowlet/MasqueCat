name: Test

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  # Required by golangci-lint-action when only-new-issues is enabled.
  pull-requests: read

concurrency:
  group: test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2
          args: --timeout=5m
          only-new-issues: true

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go test -count=1 -timeout 600s ./...
      - run: go vet ./...
  race:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: race detector for MASQUE transport and core
        run: go test -race -count=1 -timeout 900s -run 'Masque|StreamForwarder|ReceiveStreamDatagram' .
      - name: race detector for masquecat-relay
        run: go test -race -count=1 -timeout 900s ./cmd/masquecat-relay
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Fails if go.mod/go.sum or the nix flake vendor hash in
      # flakehashes.json are stale; run `make tidy` to fix.
      - run: make tidy
      - run: git diff --name-only --exit-code
  release-tags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: cross-build cmd/tailcat with release build tags
        run: |
          tags=$(cat build-tags.txt)
          echo "release tags: $tags"
          GOOS=linux   GOARCH=amd64         go build -o /dev/null -tags "$tags" ./cmd/tailcat
          GOOS=linux   GOARCH=arm64         go build -o /dev/null -tags "$tags" ./cmd/tailcat
          GOOS=linux   GOARCH=arm  GOARM=7  go build -o /dev/null -tags "$tags" ./cmd/tailcat
          GOOS=windows GOARCH=amd64         go build -o /dev/null -tags "$tags" ./cmd/tailcat
          GOOS=windows GOARCH=arm64         go build -o /dev/null -tags "$tags" ./cmd/tailcat
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build js/wasm
        run: go build -o /tmp/tailcat-web.wasm ./web
        env:
          GOOS: js
          GOARCH: wasm
      - name: verify Google Chrome is available
        run: |
          which google-chrome
          google-chrome --version
      - name: headless browser tests
        run: go test ./web/ -v -count=1 -timeout 300s --run-headless-browser-tests
