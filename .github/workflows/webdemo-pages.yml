# Builds the browser WebAssembly demo from web/.
#
# Pushes to main only verify that the static demo can still be built. Publishing
# to GitHub Pages is intentionally opt-in via workflow_dispatch so repositories
# that have not enabled Pages do not fail unrelated main-branch CI.
#
# The demo supports the legacy tc... DERP/WebSocket path and is gaining an
# mc... browser client path carried by WebTransport into a MasqueCat relay.

name: webdemo-pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "webdemo/**"
      - "internal/wasmbuild/**"
      - "internal/buildtags/**"
      - "cmd/tailcat-web/**"
      - "cmd/tailcat-webdist/**"
      - "*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/webdemo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webdemo-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: build the web demo dist
        run: go run ./cmd/tailcat-webdist -o dist
      - name: keep only the gzipped wasm
        run: rm dist/main.wasm dist/main.wasm.zst
      - name: verify static demo output
        run: |
          test -s dist/index.html
          test -s dist/app.js
          test -s dist/wasm_exec.js
          test -s dist/main.wasm.gz
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must be enabled once in repository Settings with GitHub Actions as
      # the publishing source. configure-pages then resolves the site metadata.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
